behaviors:
  GraphExplorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01          # mais alto que o do seeker: entropia e o que segura a politica
                          # explorando ACOES enquanto ela ainda nao sabe explorar o MAPA.
                          # Com 0.005 ela converge cedo demais para "andar sempre pro mesmo lado".
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false    # todas as observacoes ja saem em [-1, 1] ou [0, 1] do
                          # GraphExplorerManager; normalizar de novo so adiciona estado movel.
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      # Memoria recorrente NAO usada de proposito: a GraphExplorationMemory ja entrega "onde eu
      # ja estive" explicitamente na observacao. Um LSTM aqui aprenderia a reconstruir, a partir
      # de um historico, uma informacao que ele ja recebe pronta — mais parametros, mais tempo,
      # e um comportamento bem menos interpretavel quando algo der errado.
    reward_signals:
      extrinsic:
        # 0.995, e nao 0.99: com episodios de ate 4000 decisoes e recompensa espalhada por
        # dezenas de nos, 0.99 da um horizonte efetivo de ~100 steps — curto demais para o
        # agente ligar "atravessei este corredor" a "achei a sala do outro lado".
        gamma: 0.995
        strength: 1.0
      # Curiosity NAO usada: o bonus por no/aresta/area inedita do GraphRewardSystem faz o mesmo
      # trabalho de forma explicita, interpretavel e ajustavel no Inspector. Manter os dois
      # tornaria impossivel saber qual dos sinais causou qual comportamento.
    keep_checkpoints: 5
    max_steps: 6000000
    time_horizon: 128     # o dobro do seeker: as recompensas aqui sao mais esparsas no tempo.
    summary_freq: 20000

environment_parameters:
  # ATENCAO: os DOIS parametros abaixo formam UMA licao conceitual cada (tres licoes), mas o
  # ML-Agents avalia o curriculo de cada parametro de forma independente. Os completion_criteria
  # dos dois sao identicos de proposito — e a unica forma de garantir que avancem juntos. Se mexer
  # num threshold, mexa no outro.
  #
  # POR QUE 'reward' E NAO 'progress' (a licao que o run 05 cobrou caro):
  # com 'progress' o threshold e fracao de max_steps, ou seja, RELOGIO. No run 05 as licoes
  # viraram aos 500k, 980k e 1460k independentemente de desempenho. O agente foi promovido antes
  # de estar pronto e a recompensa desabou de +15.1 para -3.0.
  #
  # NAO EXISTE MAIS A SETA (frontier_hint / frontier_hint_steps). Ela era um sinal DIRECIONAL —
  # observacao "va por ali" + shaping por aproximacao — e o run 11 mostrou o resultado: a politica
  # aprendia a seguir a seta e a decorar rotas, nao a explorar. No lugar dela:
  #   - observacao: valor de cada SAIDA do no atual (inexplorado atras dela, descontado pela
  #     distancia, relativo a melhor saida) — dado, nao resposta; fica ligado sempre;
  #   - recompensa densa: aresta inedita, qualquer aresta, 0.02 — "andei por onde nunca andei",
  #     sem direcao.
  # Ver docs/graph/exploracao-local.md. Sem shaping direcional o comeco do treino e mais lento:
  # se o reward nao descolar em ~300k steps, o plano B e um shaping NAO-direcional (potencial
  # sobre o inexplorado descontado), nunca a seta de volta.
  #
  # OS THRESHOLDS SAO ESTIMATIVA, para a recompensa atual e o mapa atual do NodeTraining.prefab:
  # 23 primarios de peso 1 (teto de cobertura 23 x 0.75 = 17.25), +5 de conclusao, 120 arestas
  # x 0.02 = 2.4 de trajeto, ~-2 de penalidades. O threshold e avaliado DENTRO da licao que ele
  # encerra, entao cada um e ~75% do teto daquela licao:
  #   Quarter (alvo 0.3, pre 0.0):  5.2 + 5 + 0.6 - 1.5 ~=  9.3 -> threshold 7.0
  #   Half    (alvo 0.6, pre 0.25): 7.8 + 5 + 1.2 - 2.0 ~= 12.0 -> threshold 9.5
  #   Most    (alvo 0.9, pre 0.5):  7.8 + 5 + 1.5 - 2.5 ~= 11.8 -> licao final
  # Rode 200k steps por licao, olhe "Environment/Lesson Number" e as metricas Exploration/* no
  # TensorBoard e ajuste:
  #   - licao nao avanca nunca  -> threshold alto demais
  #   - avanca antes de a curva estabilizar -> threshold baixo demais
  # Errar para MAIS e mais seguro: ficar preso numa licao facil custa tempo, ser promovido cedo
  # custa a politica.
  #
  # O que quebra a decoreba de rota (alem de nao haver mais seta):
  #   1. spawn em no aleatorio (GraphArenaController._spawnAtRandomNode) — a origem varia;
  #   2. previsited_fraction abaixo — o estado inicial varia.
  # A unica coisa constante em todos os episodios passa a ser a regra, e e ela que sobra.

  # Fracao do grafo que encerra o episodio em sucesso (lida pelo GraphArenaController).
  # Comeca baixa: um alvo de 100% desde o inicio faz TODO episodio terminar em timeout, e o
  # agente nunca vê o sinal de conclusao. A fracao e sobre o que RESTA depois dos pre-visitados,
  # entao 0.9 continua sendo 0.9 do que havia para descobrir.
  coverage_target:
    curriculum:
      - name: Quarter
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 7.0
          require_reset: true
        value: 0.3
      - name: Half
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 9.5
          require_reset: true
        value: 0.6
      # 0.9, e nao 1.0: o ultimo no do mapa costuma custar tanto quanto os dez anteriores
      # juntos, e exigir cobertura perfeita transforma quase todo episodio bem-sucedido em
      # fracasso por timeout. O objetivo e percorrer o mapa, nao varre-lo. Com pre 0.5 restam
      # ~11 primarios e ele precisa de 10: se o Episode Length cravar em 1600 nesta licao, baixe
      # para 0.8 ou os pre-visitados para 0.4.
      - name: Most
        value: 0.9

  # Fracao dos PRIMARIOS que ja nasce marcada como visitada, sorteada a cada episodio (lida pelo
  # GraphArenaController, aplicada pela GraphExplorationMemory). E a variacao de ESTADO INICIAL:
  # o agente nasce no meio de uma exploracao diferente a cada episodio, ve os pre-visitados como
  # visitados (flag do vizinho, valor das saidas) e so e pago pelo que resta.
  #
  # E o que impede a politica de decorar "a partir daqui, vira a esquerda, depois a segunda porta":
  # com metade do mapa ja marcada de forma aleatoria, a sequencia certa muda toda vez, e a unica
  # coisa que funciona em todos os episodios e olhar as saidas — que e a regra.
  #
  # Zero na primeira licao de proposito: ali ele ainda esta aprendendo a andar ate um no, e
  # variar o estado inicial antes disso so deixa o sinal mais raro. Nao passa de 0.5 porque com
  # quase tudo pre-visitado o episodio vira "ache o unico no que falta", que e outra tarefa.
  previsited_fraction:
    curriculum:
      - name: Quarter
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 7.0
          require_reset: true
        value: 0.0
      - name: Half
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 9.5
          require_reset: true
        value: 0.25
      - name: Most
        value: 0.5
