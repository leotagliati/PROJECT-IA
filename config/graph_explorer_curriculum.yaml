behaviors:
  GraphExplorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01          # mais alto que o do seeker: entropia e o que segura a politica
                          # explorando ACOES enquanto ela ainda nao sabe explorar o MAPA.
                          # Com 0.005 ela converge cedo demais para "andar sempre pro mesmo lado".
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false    # todas as observacoes ja saem em [-1, 1] ou [0, 1] do
                          # GraphExplorerManager; normalizar de novo so adiciona estado movel.
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      # Memoria recorrente NAO usada de proposito: a GraphExplorationMemory ja entrega "onde eu
      # ja estive" explicitamente na observacao. Um LSTM aqui aprenderia a reconstruir, a partir
      # de um historico, uma informacao que ele ja recebe pronta — mais parametros, mais tempo,
      # e um comportamento bem menos interpretavel quando algo der errado.
    reward_signals:
      extrinsic:
        # 0.995, e nao 0.99: com episodios de ate 4000 decisoes e recompensa espalhada por
        # dezenas de nos, 0.99 da um horizonte efetivo de ~100 steps — curto demais para o
        # agente ligar "atravessei este corredor" a "achei a sala do outro lado".
        gamma: 0.995
        strength: 1.0
      # Curiosity NAO usada: o bonus por no/aresta/area inedita do GraphRewardSystem faz o mesmo
      # trabalho de forma explicita, interpretavel e ajustavel no Inspector. Manter os dois
      # tornaria impossivel saber qual dos sinais causou qual comportamento.
    keep_checkpoints: 5
    max_steps: 6000000
    time_horizon: 128     # o dobro do seeker: as recompensas aqui sao mais esparsas no tempo.
    summary_freq: 20000

environment_parameters:
  # ATENCAO: os QUATRO parametros abaixo formam UMA licao conceitual cada, mas o ML-Agents avalia
  # o curriculo de cada parametro de forma independente. Os completion_criteria dos quatro sao
  # identicos de proposito — e a unica forma de garantir que avancem juntos. Se mexer num
  # threshold, mexa nos outros tres.
  #
  # POR QUE 'reward' E NAO 'progress' (a licao que o run 05 cobrou caro):
  # com 'progress' o threshold e fracao de max_steps, ou seja, RELOGIO. No run 05 as licoes
  # viraram aos 500k, 980k e 1460k independentemente de desempenho — e a ultima cortou o
  # frontier_hint de 0.5 direto para 0.0 num salto. A recompensa vinha subindo (-4.5 -> +15.1 aos
  # 740k) e desabou para -3.0. O agente foi promovido antes de estar pronto e perdeu a muleta de
  # uma vez.
  #
  # OS THRESHOLDS SAO ESTIMATIVA, refeitos para a recompensa atual (peso por no, sem bonus de
  # regiao) e para o mapa atual do NodeTraining.prefab: 23 primarios de peso 1 (teto de cobertura
  # 23 x 0.75 = 17.25), +5 de conclusao, shaping de fronteira ~10 no mapa inteiro com hint 1.0,
  # ~-2 de penalidades. O threshold e avaliado DENTRO da licao que ele encerra, entao cada um e
  # ~75% do teto daquela licao — e o teto NAO cresce de licao em licao, porque os pre-visitados
  # tiram renda ao mesmo tempo em que a cobertura-alvo sobe:
  #   Quarter  (alvo 0.3, hint 1.0, pre 0.0):  5.2 + 5 + 3.0 - 1.5 ~= 11.7  -> threshold  8.5
  #            (o run 11 mediu 11.25 aos 140k steps, batendo com a conta)
  #   Half     (alvo 0.6, hint 0.7, pre 0.25): 7.8 + 5 + 3.1 - 2.0 ~= 13.9  -> threshold 10.5
  #   Most     (alvo 0.9, hint 0.4, pre 0.5, seta so ate 4000): 7.8 + 5 + 0.9 - 2.5 ~= 11 -> 8.0
  # Rode 200k steps por licao, olhe "Environment/Lesson Number" no TensorBoard e ajuste:
  #   - licao nao avanca nunca  -> threshold alto demais
  #   - avanca antes de a curva estabilizar -> threshold baixo demais
  # Errar para MAIS e mais seguro: ficar preso numa licao facil custa tempo, ser promovido cedo
  # custa a politica.
  #
  # O QUE MUDOU EM RELACAO AO RUN 11 (que "aprendeu a seguir a linha roxa"): aquele run parou aos
  # 140k, ainda na licao 1, onde seguir a seta E a tarefa. Mas mesmo com a seta apagando, dez spawns
  # fixos + BFS deterministica = dez rotas para decorar. Tres coisas quebram a rota:
  #   1. spawn em no aleatorio (GraphArenaController._spawnAtRandomNode) — a origem varia;
  #   2. previsited_fraction abaixo — o estado inicial varia;
  #   3. a seta sorteia entre os 3 nao-visitados mais proximos (GraphExplorationMemory) — a
  #      resposta "certa" varia.
  # A unica coisa constante em todos os episodios passa a ser a regra, e e ela que sobra.

  # Fracao do grafo que encerra o episodio em sucesso (lida pelo GraphArenaController).
  # Comeca baixa: um alvo de 100% desde o inicio faz TODO episodio terminar em timeout, e o
  # agente nunca vê o sinal de conclusao — ele passa o treino inteiro aprendendo so com o
  # shaping, que e justamente a parte que voce quer poder desligar depois.
  # A fracao e sobre o que RESTA depois dos pre-visitados, entao 0.9 continua sendo 0.9 do que
  # havia para descobrir.
  coverage_target:
    curriculum:
      - name: Quarter
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.5
          require_reset: true
        value: 0.3
      - name: Half
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 10.5
          require_reset: true
        value: 0.6
      - name: Most
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.0
          require_reset: true
        value: 0.9
      # 0.9, e nao 1.0: o ultimo no do mapa costuma custar tanto quanto os dez anteriores
      # juntos, e exigir cobertura perfeita transforma quase todo episodio bem-sucedido em
      # fracasso por timeout. O objetivo e percorrer o mapa, nao varre-lo.
      - name: MostNoHint
        value: 0.9

  # Peso da dica de fronteira: escala a OBSERVACAO da direcao do nao-visitado mais proximo e o
  # shaping de recompensa que a acompanha (os dois juntos, de proposito — sao a mesma muleta).
  #
  # Ela existe para o inicio do treino: sem nenhuma dica, o agente leva centenas de milhares de
  # steps ate topar por acaso com uma sequencia de nos ineditos boa o bastante para o PPO
  # notar. Com a dica, ele aprende rapido a NAVEGAR (seguir um rumo, atravessar porta, contornar
  # parede) e so depois precisa aprender a DECIDIR o rumo sozinho.
  #
  # Por isso ela cai no fim: uma politica treinada com a dica ligada o tempo todo aprende a
  # seguir a seta, e no cenario final essa seta pode nao existir. As ultimas licoes tiram a
  # muleta enquanto o resto do comportamento ja esta formado.
  #
  # A ESCADA E SUAVE (1.0 -> 0.7 -> 0.4 -> 0.2), e nao 1.0 -> 0.5 -> 0.0. No run 05 o corte de
  # 0.5 para 0.0 tirou de uma vez os DOIS termos de fronteira — inclusive o _frontierApproachReward,
  # que e o unico sinal denso que existe durante uma travessia. A recompensa caiu de +15.1 para
  # -3.0. Parte disso e mecanico (a renda some junto com a muleta), mas o Episode Length ficou
  # cravado em 799 dali em diante: ele parou de concluir episodio.
  #
  # Termina em 0.2 e nao em 0.0 de proposito: um fio de sinal denso mantem o gradiente vivo
  # durante a travessia sem que a politica consiga viver so dele. Se o objetivo for provar que
  # o comportamento sobrevive sem NENHUMA dica, faca isso numa avaliacao com frontier_hint = 0
  # no GraphArenaController, e nao dentro do treino — assim voce mede a politica em vez de
  # arriscar destrui-la.
  frontier_hint:
    curriculum:
      - name: Quarter
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.5
          require_reset: true
        value: 1.0
      - name: Half
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 10.5
          require_reset: true
        value: 0.7
      - name: Most
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.0
          require_reset: true
        value: 0.4
      - name: MostFadedHint
        value: 0.2

  # DURACAO da dica dentro de cada episodio, em steps de FISICA (lida pelo GraphArenaController).
  # 0 = o episodio inteiro. Depois do limite a dica vai a ZERO de verdade — observacao, shaping e
  # gizmo — e o agente termina o episodio sozinho.
  #
  # E o segundo eixo da muleta. O frontier_hint acima diz QUANTO confiar na seta; este diz POR
  # QUANTO TEMPO ela existe. A vantagem de cortar a duracao em vez da forca: a politica ve os dois
  # regimes (com e sem seta) dentro do MESMO episodio, entao a transicao acontece num estado que
  # ela ja conhece — no run 05, cortar a forca para 0.0 entre duas licoes tirou a muleta de uma vez
  # e a recompensa caiu de +15.1 para -3.0.
  #
  # Unidade: com _maxEpisodeSteps = 8000 e timestep 0.02, 8000 steps = 160 s de episodio.
  #   6000 = a seta some nos ultimos 40 s (o agente ja esta longe do spawn, fecha o mapa sozinho)
  #   4000 = metade do episodio com seta, metade sem
  #   2000 = so os primeiros 40 s: o bastante para sair da sala inicial e pegar um rumo
  # As duas primeiras licoes ficam em 0 (sem limite): la o agente ainda esta aprendendo a
  # NAVEGAR, e tirar a seta antes disso so adicionaria ruido. Os valores sao ponto de partida —
  # se o Episode Length subir e a recompensa cair na licao em que o limite entra, o corte foi
  # cedo demais; suba o numero.
  frontier_hint_steps:
    curriculum:
      - name: Quarter
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.5
          require_reset: true
        value: 0
      - name: Half
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 10.5
          require_reset: true
        value: 0
      - name: Most
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.0
          require_reset: true
        value: 4000
      - name: MostShortHint
        value: 2000

  # Fracao dos PRIMARIOS que ja nasce marcada como visitada, sorteada a cada episodio (lida pelo
  # GraphArenaController, aplicada pela GraphExplorationMemory). E a variacao de ESTADO INICIAL:
  # o agente nasce no meio de uma exploracao diferente a cada episodio, ve os pre-visitados como
  # visitados (flag do vizinho, BFS da fronteira) e so e pago pelo que resta.
  #
  # E o que impede a politica de decorar "a partir daqui, vira a esquerda, depois a segunda porta":
  # com metade do mapa ja marcada de forma aleatoria, a sequencia certa muda toda vez, e a unica
  # coisa que funciona em todos os episodios e olhar a flag "visitado" das saidas — que e a regra.
  #
  # Zero na primeira licao de proposito: ali ele ainda esta aprendendo a andar ate um no, e
  # variar o estado inicial antes disso so deixa o sinal mais raro. Sobe para 0.25 e depois 0.5;
  # nao passa de 0.5 porque com quase tudo pre-visitado o episodio vira "ache o unico no que
  # falta", que e outra tarefa (e o teto e 0.9 no GraphArenaController).
  previsited_fraction:
    curriculum:
      - name: Quarter
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.5
          require_reset: true
        value: 0.0
      - name: Half
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 10.5
          require_reset: true
        value: 0.25
      - name: Most
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 8.0
          require_reset: true
        value: 0.5
      - name: MostPrevisited
        value: 0.5
