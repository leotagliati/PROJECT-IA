# ================================================================================================
# GraphExplorer - Node_4 - E5 CACAR O HIDER QUE FOGE
#
#   mlagents-learn config/historico/graph_node4_e5_cacar.yaml --run-id=node4_e5_01 --initialize-from=node4_e4_01
#
# GERADO por tools/gen_full_curriculum.py - edite la, nao aqui. Etapas: E1 andar e explorar (com
# seta) -> E2 sem seta -> E3 achar hider parado -> E4 seguir -> E5 cacar.
# Vetor 118, 4 acoes. Nao rode a proxima etapa sem conferir o criterio desta no TensorBoard.
#
# Herda o E4: o hider FOGE quando o seeker chega a 12 m. Assist 0.5 -> 0.3.
#
#   Licao       vel   barulho threshold  min. episodios
#   Foge        2.2   0.3     11.0       300
#   FogeRapido  3.2   0.25    (final)
#
# 11 ~ 45% de captura. PASSA QUANDO (na FogeRapido): Hunt/Caught > 0.4. 5M steps.
# ================================================================================================

behaviors:
  GraphExplorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      # 0.003 (era 0.015): com 0.015 a entropia nunca caiu (E1..e2_03 em 1.42-1.48 = desvio ~1, a
      # politica continuava aleatoria). Para acoes continuas o normal e 0.001-0.005.
      beta: 0.003
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  # ---- Constantes ----
  frontier_hint: 0.0
  frontier_hint_steps: 0
  coverage_target: 1.1
  previsited_fraction: 0.0
  weight_jitter: 0.5
  value_recovery_seconds: 0.0
  area_boredom: 0
  ping_interval: 0
  ping_reward_scale: 0.0
  discovery_reward_scale: 0.3
  steer_assist: 0.3
  hider_mode: 3

  # ---- Curriculo ----
  # m/s do hider. O seeker anda a 6.
  hider_speed:
    curriculum:
      - name: Foge
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 11.0
          require_reset: true
        value: 2.2
      - name: FogeRapido
        value: 3.2

  # Chance de cada chegada do hider virar ping.
  hider_noise:
    curriculum:
      - name: Foge
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 11.0
          require_reset: true
        value: 0.3
      - name: FogeRapido
        value: 0.25
