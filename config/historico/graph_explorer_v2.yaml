          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 11.0
          require_reset: true
        value: 1.0
      - name: Perseguir
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 10.0
          require_reset: true
        value: 1.0
      - name: Cacar
        value: 1.0

  # Forca da seta de fronteira (observacao [9..12] + shaping, escalados juntos: sao a mesma
  # muleta). Escada suave 1.0 -> 0.7 -> 0.4 -> 0.2 -> 0: no run 05 o corte 0.5 -> 0.0 num salto
  # derrubou a recompensa de +15 para -3. Chega a ZERO na licao SemSeta e fica zero em tudo o que
  # vem depois - a caca e aprendida sem seta nenhuma, que e como o jogo final vai ser.
