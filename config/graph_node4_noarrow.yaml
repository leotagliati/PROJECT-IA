# ================================================================================================
# GraphExplorer - mapa da Node_4, SEM seta roxa (27/09/2026)
#
#   mlagents-learn config/graph_node4_noarrow.yaml --run-id=node4_noarrow_02
#
# Irmao do graph_node4.yaml (seta que some aos poucos). Mesmo mapa, mesma rede, mesmas licoes de
# cobertura - a UNICA diferenca e a seta: aqui ela nao existe em momento nenhum. Rodar os dois
# e comparar Exploration/Coverage responde "a seta ajuda a aprender ou so cria dependencia?".
#
# Para o NodeTraining4.prefab (133 nos: 31 primarios, 87 auxiliares, 15 de ping), com 9 copias
# na cena de treino. Os thresholds abaixo assumem:
#   - pesos NORMALIZADOS para 23 (31 x 0.742, ja feito no prefab);
#   - Make Links Bidirectional LIGADO no NavGraph. Desligado, as ligacoes de um lado so viram
#     mao unica e o agente fica cego (foi o que invalidou o run node4_01: 6/133 nos
#     alcancaveis). Confira no Console: nenhum "grafo desconexo" antes de deixar rodando;
#   - 9 arenas (min_lesson_length conta episodios de TODAS as arenas juntas);
#   - _acceleration 20 no SeekerMovementSystem e _maxEpisodeSteps 8000 (1600 decisoes).
#
# O QUE O AGENTE TEM PARA SE GUIAR SEM A SETA:
#   no atual e mais proximo alcancavel, cobertura, encostado-em-parede, e por vizinho: direcao,
#   distancia, visitado, peso, QUANTO RESTA por aquela saida (inexplorado alcancavel por ela,
#   descontado por metro), VIM DAQUI e QUANTAS VEZES ja passei (contra loop). Raios de parede presos ao mundo, em 360 graus.
#   node4_noarrow_01 (sem o "quanto resta", raios presos ao corpo) ficou 10M na Perto com
#   Coverage ~0.13 e entalando em quina; a partir do _02 o vetor e 93 (e 102 desde o graph_node4_patrol.yaml) e os .onnx antigos nao
#   servem. frontier_hint e CONSTANTE 0.0 - observacao [9..12], shaping de fronteira e gizmo
#   roxo zerados juntos. ATENCAO: frontier_hint PRECISA estar no arquivo. Sem ele o
#   GraphArenaController usa o default do Inspector (_defaultFrontierHint = 1) e a seta volta.
#
# Sem ping e sem hider (constantes em 0): caca e o PROXIMO treino, comecando deste cerebro com
# --initialize-from.
#
# ORCAMENTO (por que os thresholds sao esses):
#   cobertura = 23 x 0.75 = 17.25 no mapa inteiro, x (1 - pre-visitados) x alvo; conclusao +5;
#   shaping de fronteira = 0 (sem seta); _newEdgeReward so paga aresta primario-primario e este
#   mapa tem UMA -> morto; penalidades: existencial -2 diluida pelo tempo usado, parede e
#   estagnacao ate ~-1.5 no pior caso.
#
#   Licao        alvo  pre   jitter  renda de cobertura           teto aprox.  threshold (~65%)
#   Perto        0.3   0     0       0.3 x 17.25 = 5.2 +5         ~8.5         5.5
#   Metade       0.6   0.25  0.25    0.6 x 0.75 x 17.25 = 7.8 +5  ~10.5        7.0
#   Quase        0.9   0.5   0.5     0.9 x 0.5 x 17.25 = 7.8 +5   ~9.5         6.0
#   Tudo         0.9   0.5   0.5     (final: refino, sem threshold)
# A Quase paga MENOS que a Metade mesmo pedindo mais: os pre-visitados tiram renda e o episodio
# fica mais longo. E de proposito que o threshold nao cresce.
#
# Como ler o TensorBoard (compare por Exploration/*, nao por Cumulative Reward):
#   - Exploration/Coverage subindo dentro de cada licao e Episode Length < 1600 = aprendendo;
#   - Perto parada em ~1M steps com Coverage < 0.15 -> nao esta achando as saidas: e o sinal de
#     que falta informacao local (vizinhos a 2 arestas / valor por saida - etapa 1 do plano);
#   - licao parada ~1M steps com a curva achatada mas Coverage razoavel -> threshold alto:
#     baixe (nos TRES);
#   - Coverage despenca logo apos uma promocao -> aquela licao foi rapida: suba so ela.
# ================================================================================================

behaviors:
  GraphExplorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      # 0.015, um pouco acima do v2 (0.01): sem seta a unica forma de achar as saidas boas no
      # comeco e tentar - entropia baixa cedo demais congela a politica no primeiro corredor.
      beta: 0.015
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false    # as observacoes ja saem em [-1, 1] / [0, 1] do GraphExplorerManager
      hidden_units: 256   # mesma rede do v2: o treino de caca vai partir DESTE cerebro com
      num_layers: 2       # --initialize-from, e isso exige a mesma arquitetura
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # Horizonte longo: episodios de ate 1600 decisoes, e sem seta a recompensa de uma sala
        # nova pode estar a varias arestas de distancia.
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 500000
    # 10M: 4 licoes que avancam por desempenho, ~10 h a ~270 steps/s com 9 arenas. Se a Tudo
    # ainda estiver subindo no fim, continue com --resume e max_steps maior.
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  # ---- Constantes (sem curriculo) ----
  # Seta desligada o treino inteiro. Tem que estar aqui (ver cabecalho).
  frontier_hint: 0.0
  frontier_hint_steps: 0
  # So exploracao: sem ping aleatorio e sem hider (o que tambem desliga ping de rastro e visao).
  ping_interval: 0
  hider_mode: 0
  hider_speed: 0.0

  # ---- Curriculo ----
  # Os TRES parametros abaixo tem completion_criteria IDENTICOS de proposito: o ML-Agents
  # avalia o curriculo de cada parametro sozinho, e so assim eles avancam juntos. Mexeu num
  # threshold, mexa nos outros dois.
  #
  # Licoes: Perto -> Metade -> Quase -> Tudo

  # Fracao do que RESTA descobrir (pre-visitados fora) que encerra o episodio em sucesso (+5).
  # Alvo alto desde o inicio faria todo episodio terminar em timeout, e o agente nunca veria o
  # sinal de conclusao - sem seta isso pesa ainda mais.
  coverage_target:
    curriculum:
      - name: Perto
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 5.5
          require_reset: true
        value: 0.3
      - name: Metade
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 7.0
          require_reset: true
        value: 0.6
      - name: Quase
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 6.0
          require_reset: true
        value: 0.9
      - name: Tudo
        value: 0.9

  # Anti-decoreba: fracao dos primarios que ja nasce visitada (sorteada por episodio). Muda
  # QUAIS salas faltam a cada episodio, entao a politica nao consegue decorar uma rota.
  previsited_fraction:
    curriculum:
      - name: Perto
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 5.5
          require_reset: true
        value: 0.0
      - name: Metade
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 7.0
          require_reset: true
        value: 0.25
      - name: Quase
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 6.0
          require_reset: true
        value: 0.5
      - name: Tudo
        value: 0.5

  # Peso de cada no x U[1-j, 1+j] por episodio. A soma esperada nao muda (os thresholds
  # continuam valendo) e o peso esta na observacao de cada vizinho - a politica aprende a
  # preferir a saida que vale mais, em vez de uma ordem fixa de salas.
  weight_jitter:
    curriculum:
      - name: Perto
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 5.5
          require_reset: true
        value: 0.0
      - name: Metade
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 7.0
          require_reset: true
        value: 0.25
      - name: Quase
        completion_criteria:
          measure: reward
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 80
          threshold: 6.0
          require_reset: true
        value: 0.5
      - name: Tudo
        value: 0.5
