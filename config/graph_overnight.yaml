# TREINO DA NOITE — branch node-unexplored: 6 etapas por RELOGIO, 5.5M steps (~6 h a ~266
# steps/s com 9 arenas).
#
# O QUE ESTA BRANCH TESTA: o agente explora e persegue SEM a seta roxa, usando o VALOR DE CADA
# SAIDA (por vizinho: inexplorado e calor atras da porta, descontados pela distancia) e o MAPA
# DE CALOR (ping do hider e avistamentos viram calor que decai e difunde pelos nos).
#
# A seta NAO e enfraquecida (fade): ela e SORTEADA FORA de episodios inteiros (frontier_dropout
# = probabilidade de o episodio nascer sem seta). Fade so reescala a observacao e a rede nunca e
# obrigada a olhar os vizinhos; em episodios sem seta, o unico caminho para a recompensa passa
# pelo valor das saidas — e a politica aprende os dois mapeamentos ao mesmo tempo.
#
# POR QUE 'progress' (relogio): rodar sem supervisao e chegar a ultima etapa de qualquer jeito.
# Checkpoints a cada 500k permitem voltar ao .onnx de qualquer etapa.
#
# AS ETAPAS (fracao de max_steps em que cada uma TERMINA -> steps aproximados):
#   E0 AndarAteNo     ate 0.07 (0.4M)  cobertura 0.3, seta em todo episodio, sem hider.
#   E1 ExplorarMais   ate 0.22 (1.2M)  cobertura 0.6, pre 0.25, peso +-25%, 30% dos episodios SEM seta.
#   E2 MetadeSemSeta  ate 0.40 (2.2M)  cobertura 0.9, pre 0.5, peso +-50%, 60% sem seta, HIDER PARADO
#                                      (ping toca uma vez; calor no mapa).
#   E3 RastroQueAnda  ate 0.60 (3.3M)  90% sem seta, HIDER ANDA a 1.0 m/s; ver e se aproximar paga.
#   E4 SemSeta        ate 0.80 (4.4M)  100% sem seta, hider a 2.2 m/s. Explorar e cacar so com
#                                      vizinhos (visitado, peso, explorar, calor), cobertura, ping e visao.
#   E5 Fuga           ate 1.00 (5.5M)  HIDER FOGE a 3.2 m/s, 100% sem seta.
#
# COMO USAR:
#   mlagents-learn config/graph_overnight.yaml --run-id=night_03
#   cena Assets/Scenes/Arthur/Nodes_2.unity (9 arenas) -> Play.
#
# O QUE OLHAR DE MANHA (TensorBoard):
#   Environment/Lesson Number  em 5.
#   Exploration/HintEnabled    media cai 1 -> 0.7 -> 0.4 -> 0.1 -> 0: confirma o dropout.
#   Exploration/Coverage e StepsToTarget  E o que importa: na E4-E5 (sem seta nenhuma) devem
#                              ficar proximos do que eram na E1 (com seta). Se Coverage
#                              desabar na E4, o valor por saida nao esta sendo lido — olhar
#                              _lookaheadDecay e a esfera rosa no gizmo.
#   Exploration/RevisitRatio   vai-e-vem; deve cair ao longo do treino.
#   Cumulative Reward          cai um degrau em cada troca (renda do shaping da seta some nos
#                              episodios sem ela) — comparar por Coverage, nao por reward.
# Depois: config/graph_eval.yaml para medir a politica final e o greedy (ver docs).

behaviors:
  GraphExplorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 12
    checkpoint_interval: 500000
    max_steps: 5500000
    time_horizon: 128
    summary_freq: 20000

# Os NOVE parametros tem os mesmos thresholds (o ML-Agents avalia cada um sozinho): e o que
# garante que avancem juntos. Mudou um, mude os outros oito.
environment_parameters:
  coverage_target:
    curriculum:
      - name: E0_AndarAteNo
        completion_criteria:
          measure: progress
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.07
          require_reset: true
        value: 0.3
      - name: E1_ExplorarMais
        completion_criteria:
          measure: progress
          behavior: GraphExplorer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.22
          require_reset: true
        value: 0.6
      - name: E2_MetadeSemSeta
