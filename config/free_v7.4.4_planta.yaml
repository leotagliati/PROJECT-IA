# ================================================================================================
# FreeExplorer - v7.4.4: A PLANTA MOSTRA ONDE ELE JA ENTROU, HERDANDO O v7.4.3_visitar_01 (~7.5M). NAO E DO ZERO.
#
#   python tools/mlagents_learn_threads.py config/free_v7.4.4_planta.yaml --run-id=v7.4.4_planta_01 --initialize-from=v7.4.3_visitar_01 --env="Builds/V7.4/PROJECT-IA.exe" --no-graphics --num-envs=8 --base-port=5010
#
# A v7.4.3 paga ENTRAR em sala, mas a planta (BufferSensor "Rooms") so mostrava se a sala estava CONCLUIDA (60% vista):
# vista da porta ela parecia feita. Platô de 1M a 7M: RoomsEntered ~0.56-0.62 (12-13 de 21), ala norte
# (S03 S04 S06 S11) e S13 abaixo de 45%. Agora o campo [5] da planta e "entrou no episodio" (mesmo tamanho: herda).
# YAML e recompensa iguais aos da v7.4.3.
# CRITERIO: em ~3M, RoomsEntered acima de 0.65 e subindo, ala norte acima de ~50%; Hunt/Caught acima de ~0.5.
# ================================================================================================

behaviors:
  FreeExplorer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 10240
      # 1e-4 como na v7.3: ajuste fino de politica pronta num mapa novo. O schedule linear recomeca do 1e-4 no
      # --initialize-from (so o --resume continua de onde parou).
      learning_rate: 0.0001
      beta: 0.003
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      # Tem que ser IGUAL ao v7.3_ronda_02 (o --initialize-from carrega os pesos).
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # 0.999 da v7.3.1 (~100 s de horizonte): o mapa novo e maior que o Map - V8.
        gamma: 0.999
        strength: 1.0
    threaded: true
    keep_checkpoints: 40
    checkpoint_interval: 500000
    # 15M: a v7.2 (mesmo tipo de troca de mapa) se ajustou em ~8-10M; com o LR linear, sobra margem antes de chegar a 0.
    max_steps: 15000000
    time_horizon: 256
    summary_freq: 10000

# Sem curriculo: valores fixos da licao Final, como na v7.3.
environment_parameters:
  # 5 = misto (FreeArenaController): presa que foge ou escondida (a rapida esta em 0% no prefab).
  hider_mode: 5
  # > 1 = sem fim por cobertura (na caca o episodio e da presa).
  coverage_target: 1.1
  discovery_reward_scale: 0.5
  # Metade dos episodios com 3 chaves (KeySpots do Mapa Final).
  key_chance: 0.5
  # 1 em 4 episodios SEM PRESA: exploracao x1 e cobertura 0.9 encerra.
  explore_chance: 0.25
  # Presa = jogador da Cena Final (ver cabecalho). 0 voltaria aos do FreeHider (10.2 m/s e 8 s, os da V8.2).
  hider_speed: 8.5
  hider_stamina: 10
